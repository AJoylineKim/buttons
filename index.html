  <body>
    
    <button id="mybutton">Add To Score</button>
<div id="container"></div>
    
<button id="minusbutton">Subtrack From Score</button>
  <div id="container3"></div>

<button id="tenbutton">+10 To Score</button>
  <div id="container4"></div>

<button id="resetbutton">Reset Score</button>
  <div id="container2"></div>

<h1>What Animal Are you?</h1>

<button id="rndmbutton">Random Animal</button>
<div id="container5"></div>

<h4> Your Animal is...</h4>






<h2>Dog Walk Simulator</h2>
<p> Choose where to walk your dog!<p>


<button id="school">Walk Dog to School</button>
  <div id="box"></div>

<button id="postOffice">Walk Dog to Post Office</button>
  <div id="box2"></div>

<button id="hospital">Walk Dog to Hospital</button>
  <div id="box3"></div>

  <p id="result"></p>

    
    
<script>
  
  let score = 0;
const button = document.getElementById("mybutton");
const container = document.getElementById("container");

button.addEventListener("click", function(){ 
  score= score +1;
 container.textContent = score;
});


const resetbutton = document.getElementById("resetbutton");
const container2 = document.getElementById("container2");

resetbutton.addEventListener ("click", function(){ 
  score= 0;
 container.textContent = score;
});


const minusbuttom = document.getElementById("minusbutton");
const container3 = document.getElementById("container3");

minusbutton.addEventListener ("click", function(){ 
  score= score -1;
 container.textContent = score;
});

const tenbutton = document.getElementById("tenbutton");
const container4 = document.getElementById("container4");

tenbutton.addEventListener ("click", function(){ 
  score= score +10;
 container.textContent = score;
});



let Animals = ["Fish","Turtle","Cat","Dog","Goat"]

const rndmbutton = document.querySelector("#rndmbutton");
let container5 = document.getElementById("container5");


  // Let rndmbutton listen for mouseover
    rndmbutton.addEventListener ("click", (event) => { 
      let randomAnimals = Math.floor(Math.random() * Animals.length);
     container5.textContent = Animals [randomAnimals];
});





let schoolWalk = ["No pets allowed at school! You got kicked out!","Congrats! Your dog graduated!"]
const school = document.querySelector("#school");
let box = document.getElementById("box");

    school.addEventListener ("click", (event) => { 
      let randomMath = Math.floor(Math.random() * schoolWalk.length);
     box.textContent = schoolWalk [randomMath];
});

let mailWalk = ["Oh no! Your dog started to chase the Mailman!","Hooray! Successfully picked up your package!"]
const postOffice = document.querySelector("#postOffice");
let box2 = document.getElementById("box2");

    postOffice.addEventListener ("click", (event) => { 
      let randomMath = Math.floor(Math.random() * mailWalk.length);
     box2.textContent = mailWalk [randomMath];
});

let hospWalk = ["Your dog started to howl along with the sirens!","You visited a patient and your dog cheered them up!"]
const hospital = document.querySelector("#hospital");
let box3 = document.getElementById("box3");

    hospital.addEventListener ("click", (event) => { 
      let randomMath = Math.floor(Math.random() * hospWalk.length);
     box3.textContent = hospWalk [randomMath];
});


</script>
    
  </body>
